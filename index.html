<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsUpDLSU - Responsive Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="fw-bold">WhatsUpDLSU Dashboard</h1>
      <p class="text-muted">By Phil Samuel Tan of S16 Team 9</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-12">
        <div class="chart-card">
          <h5 class="chart-title">Registration Status</h5>
          <div class="chart-wrapper">
            <canvas id="registrationChart"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-12">
        <div class="chart-card">
          <h5 class="chart-title">Event Format Split</h5>
          <div class="chart-wrapper">
            <canvas id="formatChart"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-12">
        <div class="chart-card">
          <h5 class="chart-title">Interested vs. Attended</h5>
          <div class="chart-wrapper">
            <canvas id="attendanceChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="charts.js"></script>
</body>
</html>
